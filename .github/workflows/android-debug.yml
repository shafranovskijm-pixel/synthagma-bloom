name: Android Debug Build

on:
  push:
    branches:
      - android-release
      - android-apk-ci
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor & Android tooling
        uses: coturiv/setup-ionic@v2

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Python for icon generation
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install pillow

      - name: Generate app icons
        run: python3 .github/scripts/generate_icons.py

      - name: Copy icons into Android resources
        run: |
          cp -r .github/scripts/temp_icons/mipmap-* android/app/src/main/res/

      - name: Build Android debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
